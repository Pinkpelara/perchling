# Builds Perchlings.exe on GitHub's own Windows machine and attaches the zip to a release,
# every time the app, the sprite sheets or the build script change on main.
# Result: github.com/Pinkpelara/perchling/releases, one release per version (v0.3.0, ...).
name: Build the download

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "assets/sprites/**/*_sheet.*"
      - "tools/build_exe.py"
      - "tools/installer.iss"
      - "site/img/icon-512.png"
      - ".github/workflows/build-download.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the build needs
        run: python -m pip install --quiet pillow pyinstaller

      - name: Read the version number
        id: ver
        shell: bash
        run: echo "v=$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' app/perchling.py)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: python tools/build_exe.py

      - name: Build the installers (one per pet, plus one that asks)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $v = "${{ steps.ver.outputs.v }}"
          & $iscc /Q /DAppVersion=$v tools\installer.iss
          foreach ($pet in @("antenna=Teal", "ears=Pink", "leaf=Green", "horns=Gold")) {
            $id, $label = $pet.Split("=")
            & $iscc /Q /DAppVersion=$v /DPet=$id /DPetLabel=$label tools\installer.iss
          }

      - name: Copy under fixed names too
        shell: bash
        run: |
          v=${{ steps.ver.outputs.v }}
          cp dist/Perchlings-$v-windows.zip dist/Perchlings-windows.zip
          cp dist/PerchlingsSetup-$v.exe dist/PerchlingsSetup.exe
          for pet in Teal Pink Green Gold; do cp dist/PerchlingsSetup-$v-$pet.exe dist/PerchlingsSetup-$pet.exe; done
          ls -la dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Perchlings ${{ steps.ver.outputs.v }}
          body: |
            Windows 10 and 11. Download the installer for the pet that was adopted (Teal, Pink, Green or Gold), double-click it, click Next, and that pet walks out.
            PerchlingsSetup without a name holds all four and asks which one you adopted; use it for a second pet.
            The zip is the same app without an installer: unzip, keep the folder together, double-click Perchlings.exe.
          files: |
            dist/PerchlingsSetup-${{ steps.ver.outputs.v }}-Teal.exe
            dist/PerchlingsSetup-${{ steps.ver.outputs.v }}-Pink.exe
            dist/PerchlingsSetup-${{ steps.ver.outputs.v }}-Green.exe
            dist/PerchlingsSetup-${{ steps.ver.outputs.v }}-Gold.exe
            dist/PerchlingsSetup-${{ steps.ver.outputs.v }}.exe
            dist/PerchlingsSetup-Teal.exe
            dist/PerchlingsSetup-Pink.exe
            dist/PerchlingsSetup-Green.exe
            dist/PerchlingsSetup-Gold.exe
            dist/PerchlingsSetup.exe
            dist/Perchlings-${{ steps.ver.outputs.v }}-windows.zip
            dist/Perchlings-windows.zip
