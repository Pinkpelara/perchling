# Builds Perchlings.exe on GitHub's own Windows machine and attaches the zip to a release,
# every time the app, the sprite sheets or the build script change on main.
# Result: github.com/Pinkpelara/perchling/releases, one release per version (v0.3.0, ...).
name: Build the download

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "assets/sprites/**/*_sheet.*"
      - "tools/build_exe.py"
      - "tools/installer.iss"
      - "site/img/icon-512.png"
      - ".github/workflows/build-download.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the build needs
        run: python -m pip install --quiet pillow pyinstaller pycaw comtypes

      - name: Read the version number
        id: ver
        shell: bash
        run: echo "v=$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' app/perchling.py)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: python tools/build_exe.py

      - name: Build the installer (one household; pets unlock with a code)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $v = "${{ steps.ver.outputs.v }}"
          & $iscc /Q /DAppVersion=$v tools\installer.iss

      - name: Copy under fixed names too
        shell: bash
        run: |
          v=${{ steps.ver.outputs.v }}
          cp dist/Perchlings-$v-windows.zip dist/Perchlings-windows.zip
          cp dist/PerchlingsSetup-$v.exe dist/PerchlingsSetup.exe
          ls -la dist

      # GitHub sometimes drops one upload ("Error saving asset"; it took 0.28.1 with it). The release is created by tag,
      # so a second try finds it and only fills in whatever is missing; a third try covers a bad minute.
      - name: Publish the release
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Perchlings ${{ steps.ver.outputs.v }}
          body: |
            Windows 10 and 11. Download PerchlingsSetup.exe, double-click it, click Next, type the code from your email, name your pet, and it walks out.
            One download covers every pet: a later adoption is a code you enter from any pet's panel.
            The zip is the same app without an installer: unzip, keep the folder together, double-click Perchlings.exe.
          files: |
            dist/PerchlingsSetup-${{ steps.ver.outputs.v }}.exe
            dist/PerchlingsSetup.exe
            dist/Perchlings-${{ steps.ver.outputs.v }}-windows.zip
            dist/Perchlings-windows.zip
      - name: Publish the release (second try)
        id: publish2
        if: steps.publish.outcome == 'failure'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Perchlings ${{ steps.ver.outputs.v }}
          files: |
            dist/PerchlingsSetup-${{ steps.ver.outputs.v }}.exe
            dist/PerchlingsSetup.exe
            dist/Perchlings-${{ steps.ver.outputs.v }}-windows.zip
            dist/Perchlings-windows.zip
      - name: Publish the release (third try)
        if: steps.publish.outcome == 'failure' && steps.publish2.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Perchlings ${{ steps.ver.outputs.v }}
          files: |
            dist/PerchlingsSetup-${{ steps.ver.outputs.v }}.exe
            dist/PerchlingsSetup.exe
            dist/Perchlings-${{ steps.ver.outputs.v }}-windows.zip
            dist/Perchlings-windows.zip
      - name: Every file is on the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.ver.outputs.v }}
          names=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$v" | python -c "import json,sys; print(' '.join(a['name'] for a in json.load(sys.stdin)['assets']))")
          echo "on the release: $names"
          for f in PerchlingsSetup-$v.exe PerchlingsSetup.exe Perchlings-$v-windows.zip Perchlings-windows.zip; do
            case " $names " in *" $f "*) ;; *) echo "missing: $f"; exit 1;; esac
          done
